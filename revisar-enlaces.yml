name: Revisar enlaces de las tiendas

# Se ejecuta el día 1 de cada mes (07:00 UTC) y también a mano desde la pestaña Actions.
on:
  schedule:
    - cron: '0 7 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Revisar las webs y abrir un aviso con el resultado
        uses: actions/github-script@v7
        env:
          DATA_FILE: productos.json
          SITIO: venenin.uk
          GUIA: Productos Venezolanos
        with:
          script: |
            const fs = require('fs');
            const tiendas = JSON.parse(fs.readFileSync(process.env.DATA_FILE, 'utf8'));
            const UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36';

            async function probar(url) {
              const ctl = new AbortController();
              const timer = setTimeout(() => ctl.abort(), 25000);
              try {
                const r = await fetch(url, { redirect: 'follow', signal: ctl.signal, headers: { 'User-Agent': UA, 'Accept': 'text/html,*/*' } });
                return { status: r.status, finalUrl: r.url };
              } catch (e) {
                return { error: (e.cause && e.cause.code) || e.name || String(e) };
              } finally {
                clearTimeout(timer);
              }
            }

            const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } };
            const caidos = [], cambiados = [], bloqueados = [], bien = [];

            for (const t of tiendas) {
              if (!t.sitioWeb) continue;
              const r = await probar(t.sitioWeb);
              const fila = { nombre: t.nombre, url: t.sitioWeb, r };
              if (r.error || [404, 410, 500, 502, 504, 521, 522, 523, 525].includes(r.status)) caidos.push(fila);
              else if ([401, 403, 429, 503].includes(r.status)) bloqueados.push(fila);
              else if (host(r.finalUrl) && host(r.finalUrl) !== host(t.sitioWeb)) cambiados.push(fila);
              else bien.push(fila);
              await new Promise(res => setTimeout(res, 400));
            }

            const estado = r => r.error ? `error de conexión (${r.error})` : `respuesta ${r.status}`;
            const lista = (arr, extra) => arr.map(f => `- **${f.nombre}**: ${f.url} → ${extra ? extra(f) : estado(f.r)}`).join('\n');
            const fecha = new Date().toISOString().slice(0, 7);
            const hayProblemas = caidos.length || cambiados.length;

            let cuerpo = `@${context.repo.owner} Revisión mensual de enlaces de **${process.env.GUIA}** (${process.env.SITIO}): `
              + `${bien.length} bien, ${caidos.length} posiblemente caídos, ${cambiados.length} con cambio de dominio, ${bloqueados.length} que bloquean la revisión automática.\n\n`;
            if (!hayProblemas && !bloqueados.length) cuerpo += 'Todas las webs responden con normalidad. No hay nada que hacer este mes. ✅\n';
            if (caidos.length) cuerpo += `### Posiblemente caídos o cerrados (revisar primero)\n${lista(caidos)}\n\n`;
            if (cambiados.length) cuerpo += `### Redirigen a otro dominio (puede que la tienda se haya mudado o cambiado de nombre)\n${lista(cambiados, f => 'redirige a ' + f.r.finalUrl)}\n\n`;
            if (bloqueados.length) cuerpo += `### Bloquean la revisión automática (abrirlas a mano; suelen ser protecciones anti-bots)\n${lista(bloqueados)}\n\n`;
            cuerpo += `---\nPara corregir una ficha, avisale a Claude qué tienda cerró o cambió y se actualiza la guía.`;

            // Cierra los avisos de meses anteriores para que quede uno solo abierto.
            const abiertos = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'open', per_page: 100 });
            for (const i of abiertos) {
              if (!i.pull_request && i.title.startsWith('Revisión de enlaces')) {
                await github.rest.issues.update({ ...context.repo, issue_number: i.number, state: 'closed' });
              }
            }
            const titulo = `Revisión de enlaces – ${fecha}${hayProblemas ? ' ⚠️' : ' ✅'}`;
            await github.rest.issues.create({ ...context.repo, title: titulo, body: cuerpo });
            console.log(cuerpo);
