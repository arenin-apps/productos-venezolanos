name: Revisar enlaces de las tiendas

# Se ejecuta el día 1 de cada mes (07:00 UTC) y también a mano desde la pestaña Actions.
# La lógica de la revisión está en revisar-enlaces.cjs (raíz del repositorio).
on:
  schedule:
    - cron: '0 7 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Revisar las webs y abrir un aviso con el resultado
        uses: actions/github-script@v7
        env:
          DATA_FILE: productos.json
          SITIO: venenin.uk
          GUIA: Productos Venezolanos
        with:
          script: |
            await require('${{ github.workspace }}/revisar-enlaces.cjs')({ github, context })
